<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Card — Light Theme</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #F2F2F7; color: #000;
    max-width: 430px; margin: 0 auto;
    padding: 24px 16px 40px;
  }
  .col-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: rgba(0,0,0,0.35);
    margin-bottom: 8px;
  }
  .card {
    background: #fff; border: 1px solid rgba(0,0,0,0.10);
    border-radius: 16px; margin-bottom: 8px;
  }
  .card-inner { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }

  /* left: symbol + name */
  .card-left { flex: 1; min-width: 0; }
  .symbol { font-weight: 700; font-size: 17px; color: #000; }
  .name   { font-size: 11px; color: rgba(0,0,0,0.60); margin-top: 2px; }

  /* middle: category + budget */
  .card-mid { text-align: right; flex-shrink: 0; }
  .cat   { font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.60); }
  .budg  { font-size: 12px; color: rgba(0,0,0,0.40); margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* right: % + chevron */
  .pct-area { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .pct-box  {
    width: 52px; padding: 7px 8px; background: #E5E5EA;
    border-radius: 10px; font-size: 15px; text-align: right;
    font-variant-numeric: tabular-nums; color: #000;
  }
  .pct-sign { font-size: 15px; color: rgba(0,0,0,0.40); }
  .chevron  { font-size: 14px; color: rgba(0,0,0,0.25); }

  .divider { height: 1px; background: rgba(0,0,0,0.08); margin: 16px 0 12px; }
</style>
</head>
<body>

<div class="col-title">After — category in middle column</div>

<div class="card"><div class="card-inner">
  <div class="card-left">
    <div class="symbol">BEL</div>
    <div class="name">Bharat Electronics</div>
  </div>
  <div class="card-mid">
    <div class="cat">Defence</div>
    <div class="budg">₹2.4L</div>
  </div>
  <div class="pct-area">
    <div class="pct-box">10</div><div class="pct-sign">%</div><div class="chevron">⌄</div>
  </div>
</div></div>

<div class="card"><div class="card-inner">
  <div class="card-left">
    <div class="symbol">HAL</div>
    <div class="name">Hindustan Aeronautics</div>
  </div>
  <div class="card-mid">
    <div class="cat">Defence</div>
    <div class="budg">₹3.0L</div>
  </div>
  <div class="pct-area">
    <div class="pct-box">10</div><div class="pct-sign">%</div><div class="chevron">⌄</div>
  </div>
</div></div>

<div class="card"><div class="card-inner">
  <div class="card-left">
    <div class="symbol">POLYCAB</div>
    <div class="name">Polycab India</div>
  </div>
  <div class="card-mid">
    <div class="cat">Capital Goods</div>
    <div class="budg">₹2.4L</div>
  </div>
  <div class="pct-area">
    <div class="pct-box">10</div><div class="pct-sign">%</div><div class="chevron">⌄</div>
  </div>
</div></div>

<div class="card"><div class="card-inner">
  <div class="card-left">
    <div class="symbol">NIFTYBEES</div>
    <div class="name">Nifty 50 ETF</div>
  </div>
  <div class="card-mid">
    <div class="cat">Index/ETF</div>
    <div class="budg">₹1.5L <span style="color:#30D158">+₹40K</span></div>
  </div>
  <div class="pct-area">
    <div class="pct-box">5</div><div class="pct-sign">%</div><div class="chevron">⌄</div>
  </div>
</div></div>

<div class="card"><div class="card-inner">
  <div class="card-left">
    <div class="symbol">NH</div>
    <div class="name">Narayana Hrudayalaya</div>
  </div>
  <div class="card-mid">
    <div class="cat">Hospitals</div>
    <div class="budg">₹2.2L</div>
  </div>
  <div class="pct-area">
    <div class="pct-box">9</div><div class="pct-sign">%</div><div class="chevron">⌄</div>
  </div>
</div></div>

</body>
</html>
