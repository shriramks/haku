<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bands — Signal Bar Mock</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f2f2f7;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(242,242,247,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid #d1d1d6;
    padding: 52px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 28px; font-weight: 700; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .fy-pill {
    background: #fff;
    border: 1px solid #d1d1d6;
    color: #555;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 10px;
  }
  .avatar {
    width: 32px; height: 32px;
    background: #e5e5ea;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #666;
  }

  /* Row */
  .row-wrap {
    border-bottom: 1px solid #e5e5ea;
    background: #fff;
    border-left: 4px solid transparent;
  }
  .row-wrap.deep { border-left-color: #34d399; }
  .row-wrap.buy  { border-left-color: #34C759; }
  .row-wrap.dim  { opacity: 0.4; }

  .row {
    display: flex;
  }

  /* Signal bar — left edge */
  .signal-bar { display: none; }

  .row-inner {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 16px;
    cursor: pointer;
  }

  .row-left {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .symbol {
    font-size: 17px;
    font-weight: 700;
    color: #000;
    flex-shrink: 0;
  }
  .cmp {
    font-size: 15px;
    color: #888;
    font-variant-numeric: tabular-nums;
  }

  .row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn-bands {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 10px;
    background: rgba(10,132,255,0.10);
    color: #0A84FF;
    border: 1px solid rgba(10,132,255,0.25);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
  }
  .btn-cmp {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 10px;
    background: #f2f2f7;
    color: #666;
    border: 1px solid #d1d1d6;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
  }
  .chevron {
    color: #c7c7cc;
    font-size: 16px;
    line-height: 1;
  }

  /* Section label */
  .section-label {
    padding: 8px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: #aaa;
    background: #f2f2f7;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 390px;
    margin: 0 auto;
    background: rgba(242,242,247,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid #d1d1d6;
    display: flex;
    padding: 8px 0 28px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: #aaa;
    font-size: 10px;
  }
  .nav-item.active { color: #0A84FF; }
  .nav-icon { font-size: 22px; line-height: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>Buy Bands</h1>
  <div class="header-right">
    <div class="fy-pill">FY26</div>
    <div class="avatar">S</div>
  </div>
</div>

<!-- DEEP signal -->
<div class="row-wrap deep">
  <div class="row">
    <div class="signal-bar"></div>
    <div class="row-inner">
      <div class="row-left">
        <span class="symbol">DMART</span>
        <span class="cmp">₹3,420</span>
      </div>
      <div class="row-actions">
        <div class="btn-bands">✦ Bands</div>
        <div class="btn-cmp">↻ CMP</div>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</div>

<!-- BUY signal -->
<div class="row-wrap buy">
  <div class="row">
    <div class="signal-bar"></div>
    <div class="row-inner">
      <div class="row-left">
        <span class="symbol">NH</span>
        <span class="cmp">₹1,090</span>
      </div>
      <div class="row-actions">
        <div class="btn-bands">✦ Bands</div>
        <div class="btn-cmp">↻ CMP</div>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</div>

<!-- BUY signal -->
<div class="row-wrap buy">
  <div class="row">
    <div class="signal-bar"></div>
    <div class="row-inner">
      <div class="row-left">
        <span class="symbol">IEX</span>
        <span class="cmp">₹174</span>
      </div>
      <div class="row-actions">
        <div class="btn-bands">✦ Bands</div>
        <div class="btn-cmp">↻ CMP</div>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</div>

<!-- No signal — HOLD -->
<div class="row-wrap">
  <div class="row">
    <div class="signal-bar"></div>
    <div class="row-inner">
      <div class="row-left">
        <span class="symbol">BEL</span>
        <span class="cmp">₹268</span>
      </div>
      <div class="row-actions">
        <div class="btn-bands">✦ Bands</div>
        <div class="btn-cmp">↻ CMP</div>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</div>

<!-- No signal — HOLD -->
<div class="row-wrap">
  <div class="row">
    <div class="signal-bar"></div>
    <div class="row-inner">
      <div class="row-left">
        <span class="symbol">ITC</span>
        <span class="cmp">₹440</span>
      </div>
      <div class="row-actions">
        <div class="btn-bands">✦ Bands</div>
        <div class="btn-cmp">↻ CMP</div>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</div>

<!-- No CMP yet -->
<div class="row-wrap">
  <div class="row">
    <div class="signal-bar"></div>
    <div class="row-inner">
      <div class="row-left">
        <span class="symbol">SBILIFE</span>
      </div>
      <div class="row-actions">
        <div class="btn-bands">✦ Bands</div>
        <div class="btn-cmp">↻ CMP</div>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</div>

<!-- Divider -->
<div class="section-label">Completed</div>

<!-- Completed / dim -->
<div class="row-wrap dim">
  <div class="row">
    <div class="signal-bar"></div>
    <div class="row-inner">
      <div class="row-left">
        <span class="symbol">TCS</span>
        <span class="cmp">₹3,890</span>
      </div>
      <div class="row-actions">
        <div class="btn-bands">✦ Bands</div>
        <div class="btn-cmp">↻ CMP</div>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</div>

<div style="height: 88px"></div>

<div class="bottom-nav">
  <div class="nav-item"><span class="nav-icon">□</span>Allocation</div>
  <div class="nav-item active"><span class="nav-icon">◈</span>Bands</div>
  <div class="nav-item"><span class="nav-icon">☰</span>Plan</div>
  <div class="nav-item"><span class="nav-icon">↕</span>Txns</div>
</div>

</body>
</html>
