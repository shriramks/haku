<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Fixed Position Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    overscroll-behavior: none;            /* toggle A */
    color-scheme: light dark;
  }

  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #F2F2F7;
    min-height: 100dvh;                   /* toggle B */
  }

  .page {
    min-height: 100dvh;                   /* toggle C */
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 60px 16px 12px;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    backdrop-filter: blur(24px);          /* toggle D */
    -webkit-backdrop-filter: blur(24px);  /* toggle D */
    background: rgba(242,242,247,0.9);
  }

  .content {
    padding: 16px;
  }

  .row {
    padding: 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    font-size: 17px;
  }

  .spacer {
    height: calc(env(safe-area-inset-bottom, 0px) + 88px);   /* toggle E */
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    padding-bottom: 8px;
    background: #F2F2F7;
  }

  .pill {
    flex: 1;
    display: flex;
    justify-content: space-around;
    padding: 8px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.13), 0 2px 6px rgba(0,0,0,0.07);
  }

  .pill span {
    font-size: 10px;
    padding: 8px 12px;
    border-radius: 16px;
  }

  .add-btn {
    width: 60px;
    height: 60px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.13), 0 2px 6px rgba(0,0,0,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    border: none;
  }

  .controls {
    position: fixed;
    top: 100px;
    right: 8px;
    z-index: 100;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    max-width: 240px;
  }
  .controls label { display: block; margin: 4px 0; cursor: pointer; }
  .controls input { margin-right: 6px; }
</style>
</head>
<body>

<div class="page" id="page">
  <div class="header" id="header">
    <h1 style="font-size:28px;font-weight:bold;">Test Page</h1>
  </div>
  <div class="content">
    <div class="row">Row 1 — JUNIORBEES</div>
    <div class="row">Row 2 — NIFTYBEES</div>
    <div class="row">Row 3 — CAMS</div>
    <div class="row">Row 4 — IEX</div>
    <div class="row">Row 5 — ITC</div>
    <div class="row">Row 6 — NH</div>
  </div>
  <div class="spacer" id="spacer"></div>
</div>

<nav class="bottom-nav" id="nav">
  <div class="pill">
    <span>Allocation</span>
    <span>Bands</span>
    <span>Txns</span>
    <span>Plan</span>
  </div>
  <button class="add-btn">+</button>
</nav>

<!-- Toggle panel to isolate the trigger -->
<div class="controls">
  <strong>Toggle to find trigger:</strong>
  <label><input type="checkbox" checked onchange="toggleA(this.checked)"> A: overscroll-behavior: none</label>
  <label><input type="checkbox" checked onchange="toggleB(this.checked)"> B: body min-height: 100dvh</label>
  <label><input type="checkbox" checked onchange="toggleC(this.checked)"> C: page min-height: 100dvh</label>
  <label><input type="checkbox" checked onchange="toggleD(this.checked)"> D: backdrop-filter on header</label>
  <label><input type="checkbox" checked onchange="toggleE(this.checked)"> E: bottom spacer div</label>
  <label><input type="checkbox" onchange="toggleF(this.checked)"> F: nav transform:translateZ(0)</label>
  <label><input type="checkbox" onchange="toggleG(this.checked)"> G: add more rows (fill page)</label>
</div>

<script>
function toggleA(on) {
  document.documentElement.style.overscrollBehavior = on ? 'none' : '';
}
function toggleB(on) {
  document.body.style.minHeight = on ? '100dvh' : '';
}
function toggleC(on) {
  document.getElementById('page').style.minHeight = on ? '100dvh' : '';
}
function toggleD(on) {
  const h = document.getElementById('header');
  h.style.backdropFilter = on ? 'blur(24px)' : 'none';
  h.style.webkitBackdropFilter = on ? 'blur(24px)' : 'none';
}
function toggleE(on) {
  document.getElementById('spacer').style.height = on ? 'calc(env(safe-area-inset-bottom,0px) + 88px)' : '0';
}
function toggleF(on) {
  document.getElementById('nav').style.transform = on ? 'translateZ(0)' : '';
}
function toggleG(on) {
  const content = document.querySelector('.content');
  const extra = document.querySelectorAll('.extra-row');
  if (on) {
    for (let i = 7; i <= 20; i++) {
      const d = document.createElement('div');
      d.className = 'row extra-row';
      d.textContent = 'Row ' + i + ' — EXTRA';
      content.appendChild(d);
    }
  } else {
    extra.forEach(el => el.remove());
  }
}
</script>
</body>
</html>
