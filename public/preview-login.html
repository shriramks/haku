<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Preview — Light & Dark</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: #888;
    display: flex;
    gap: 32px;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 24px;
    min-height: 100vh;
    flex-wrap: wrap;
  }

  .phone {
    width: 390px;
    min-height: 720px;
    border-radius: 48px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 32px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.15);
    position: relative;
  }

  .label {
    text-align: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }

  /* ── LIGHT THEME ─────────────────────────────── */
  .light {
    background: #F2F2F7;
  }
  .light .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 32px 64px;
    background: #F2F2F7;
  }
  .light .logo-emoji { font-size: 64px; margin-bottom: 16px; }
  .light .app-title  { font-size: 30px; font-weight: 700; color: #000; letter-spacing: -0.5px; }
  .light .tagline    { font-size: 14px; color: rgba(0,0,0,0.4); margin-top: 4px; margin-bottom: 48px; }
  .light input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.10);
    color: #000;
    font-size: 16px;
    outline: none;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .light input::placeholder { color: rgba(0,0,0,0.3); }
  .light .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: #000;
    color: #F2F2F7;
    font-size: 16px;
    font-weight: 700;
    border: none;
    margin-top: 4px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  .light .btn-secondary {
    width: 100%;
    padding: 8px;
    background: none;
    border: none;
    color: rgba(0,0,0,0.4);
    font-size: 14px;
    font-family: inherit;
  }

  /* ── DARK THEME ──────────────────────────────── */
  .dark {
    background: #000;
  }
  .dark .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 32px 64px;
    background: #000;
  }
  .dark .logo-emoji { font-size: 64px; margin-bottom: 16px; }
  .dark .app-title  { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .dark .tagline    { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 4px; margin-bottom: 48px; }
  .dark input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    background: #1C1C1E;
    border: 1px solid rgba(255,255,255,0.10);
    color: #fff;
    font-size: 16px;
    outline: none;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .dark input::placeholder { color: rgba(255,255,255,0.3); }
  .dark .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: #fff;
    color: #000;
    font-size: 16px;
    font-weight: 700;
    border: none;
    margin-top: 4px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  .dark .btn-secondary {
    width: 100%;
    padding: 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    font-family: inherit;
  }
</style>
</head>
<body>

<!-- Light -->
<div>
  <p class="label">Light</p>
  <div class="phone light">
    <div class="screen">
      <div class="logo-emoji">📈</div>
      <div class="app-title">Haku</div>
      <div class="tagline">Your Indian stock playbook</div>
      <div style="width:100%">
        <input type="email" placeholder="Email" value="">
        <input type="password" placeholder="Password" value="">
        <button class="btn-primary">Sign in</button>
        <button class="btn-secondary">New here? Create account</button>
      </div>
    </div>
  </div>
</div>

<!-- Dark -->
<div>
  <p class="label">Dark</p>
  <div class="phone dark">
    <div class="screen">
      <div class="logo-emoji">📈</div>
      <div class="app-title">Haku</div>
      <div class="tagline">Your Indian stock playbook</div>
      <div style="width:100%">
        <input type="email" placeholder="Email" value="">
        <input type="password" placeholder="Password" value="">
        <button class="btn-primary">Sign in</button>
        <button class="btn-secondary">New here? Create account</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
