<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your Haku account</title>
</head>
<body style="margin:0;padding:0;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F2F2F7;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">

          <!-- Logo / App name -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <span style="font-size:22px;font-weight:700;color:#1C1C1E;letter-spacing:-0.3px;">Haku</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#ffffff;border-radius:20px;padding:36px 32px;box-shadow:0 2px 12px rgba(0,0,0,0.06);">

              <!-- Heading -->
              <p style="margin:0 0 8px;font-size:22px;font-weight:700;color:#1C1C1E;letter-spacing:-0.3px;">
                Confirm your email
              </p>
              <p style="margin:0 0 28px;font-size:15px;color:#6C6C70;line-height:1.5;">
                Click the button below to verify your email address and activate your account.
              </p>

              <!-- CTA button -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;background:#0A84FF;color:#ffffff;font-size:16px;
                              font-weight:600;text-decoration:none;padding:14px 32px;
                              border-radius:12px;letter-spacing:-0.1px;">
                      Confirm Email →
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0;">
                <tr>
                  <td style="border-top:1px solid #E5E5EA;"></td>
                </tr>
              </table>

              <!-- Fallback link -->
              <p style="margin:0 0 6px;font-size:13px;color:#6C6C70;">
                Button not working? Copy and paste this link:
              </p>
              <p style="margin:0;font-size:12px;color:#0A84FF;word-break:break-all;line-height:1.5;">
                {{ .ConfirmationURL }}
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0;font-size:12px;color:#AEAEB2;line-height:1.6;">
                If you didn't create a Haku account, you can safely ignore this email.<br>
                This link expires in 24 hours.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
