<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Tab Bar — Option C refined</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; padding: 24px 16px 80px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #000; }
  .subtitle { font-size: 13px; color: rgba(0,0,0,0.45); margin-bottom: 28px; }
  .option-label { font-size: 13px; font-weight: 600; color: rgba(0,0,0,0.45); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .option-desc { font-size: 13px; color: rgba(0,0,0,0.5); margin-bottom: 12px; }

  .page-bg {
    border-radius: 16px;
    height: 140px;
    display: flex;
    align-items: flex-end;
    padding-bottom: 16px;
    position: relative;
    overflow: visible;
  }

  /* ── Shared ── */
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; border-radius: 16px; padding: 7px 10px; transition: background 0.15s; }
  .tab svg { width: 22px; height: 22px; }
  .tab span { font-size: 10px; font-weight: 500; white-space: nowrap; }
  .tab.inactive { color: rgba(0,0,0,0.35); }
  .tab.active { color: #000; background: rgba(0,0,0,0.07); }
  .tab.active span { font-weight: 600; }

  /* pill shared */
  .pill {
    background: rgba(255,255,255,0.96);
    border-radius: 28px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.13), 0 2px 6px rgba(0,0,0,0.07);
  }

  /* tab pill */
  .nav-tabs {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 6px 6px;
  }

  /* add pill */
  .nav-add {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    flex-shrink: 0;
  }

  .add-icon { color: #000; display: flex; align-items: center; justify-content: center; }
  .add-icon svg { width: 26px; height: 26px; stroke-width: 2.2; }

  /* wrapper */
  .nav-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    width: 100%;
  }

  /* dark toggle */
  .dark-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; font-size: 13px; color: rgba(0,0,0,0.5); }
  .dark-toggle input { width: 36px; height: 20px; appearance: none; background: #ccc; border-radius: 10px; position: relative; cursor: pointer; transition: background 0.2s; }
  .dark-toggle input:checked { background: #34C759; }
  .dark-toggle input::after { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: left 0.2s; }
  .dark-toggle input:checked::after { left: 18px; }

  /* dark */
  body.dark { background: #111; }
  body.dark h1 { color: #fff; }
  body.dark .subtitle, body.dark .option-label, body.dark .option-desc { color: rgba(255,255,255,0.4); }
  body.dark .pill { background: rgba(36,36,38,0.97); box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3); }
  body.dark .tab.inactive { color: rgba(255,255,255,0.35); }
  body.dark .tab.active { color: #fff; background: rgba(255,255,255,0.11); }
  body.dark .add-icon { color: #fff; }
</style>
</head>
<body>

<h1>Floating Tab — C refined</h1>
<p class="subtitle">Labels added · add button matches pill background</p>

<label class="dark-toggle">
  <input type="checkbox" onchange="document.body.classList.toggle('dark', this.checked)">
  Dark mode
</label>

<svg style="display:none">
  <symbol id="ic-alloc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/>
    <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/>
  </symbol>
  <symbol id="ic-bands" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
  </symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
  </symbol>
  <symbol id="ic-txns" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
  </symbol>
  <symbol id="ic-plan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
  </symbol>
</svg>

<!-- Allocation active -->
<div class="option-label" style="margin-bottom:8px">Allocation active</div>
<div class="page-bg" style="margin-bottom:28px">
  <div class="nav-wrap">
    <div class="nav-tabs pill">
      <div class="tab active"><svg><use href="#ic-alloc"/></svg><span>Allocation</span></div>
      <div class="tab inactive"><svg><use href="#ic-bands"/></svg><span>Buy Bands</span></div>
      <div class="tab inactive"><svg><use href="#ic-txns"/></svg><span>Transactions</span></div>
      <div class="tab inactive"><svg><use href="#ic-plan"/></svg><span>Plan</span></div>
    </div>
    <div class="nav-add pill">
      <div class="add-icon"><svg><use href="#ic-plus"/></svg></div>
    </div>
  </div>
</div>

<!-- Buy Bands active -->
<div class="option-label" style="margin-bottom:8px">Buy Bands active</div>
<div class="page-bg" style="margin-bottom:28px">
  <div class="nav-wrap">
    <div class="nav-tabs pill">
      <div class="tab inactive"><svg><use href="#ic-alloc"/></svg><span>Allocation</span></div>
      <div class="tab active"><svg><use href="#ic-bands"/></svg><span>Buy Bands</span></div>
      <div class="tab inactive"><svg><use href="#ic-txns"/></svg><span>Transactions</span></div>
      <div class="tab inactive"><svg><use href="#ic-plan"/></svg><span>Plan</span></div>
    </div>
    <div class="nav-add pill">
      <div class="add-icon"><svg><use href="#ic-plus"/></svg></div>
    </div>
  </div>
</div>

<!-- Transactions active -->
<div class="option-label" style="margin-bottom:8px">Transactions active</div>
<div class="page-bg">
  <div class="nav-wrap">
    <div class="nav-tabs pill">
      <div class="tab inactive"><svg><use href="#ic-alloc"/></svg><span>Allocation</span></div>
      <div class="tab inactive"><svg><use href="#ic-bands"/></svg><span>Buy Bands</span></div>
      <div class="tab active"><svg><use href="#ic-txns"/></svg><span>Transactions</span></div>
      <div class="tab inactive"><svg><use href="#ic-plan"/></svg><span>Plan</span></div>
    </div>
    <div class="nav-add pill">
      <div class="add-icon"><svg><use href="#ic-plus"/></svg></div>
    </div>
  </div>
</div>

</body>
</html>
