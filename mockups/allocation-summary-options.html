<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Allocation Summary — Option A</title>
<style>
  :root {
    --bg-primary:   #F2F2F7;
    --bg-secondary: #FFFFFF;
    --bg-tertiary:  #E5E5EA;
    --bg-nav:       rgba(242,242,247,0.92);
    --text-primary: #000000;
    --text-2:       rgba(0,0,0,0.60);
    --text-muted:   rgba(0,0,0,0.40);
    --text-faint:   rgba(0,0,0,0.25);
    --border:       rgba(0,0,0,0.10);
    --border-faint: rgba(0,0,0,0.06);
    --bar-fill:     #2150A8;
    --c-positive:   #34C759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary:   #000000;
      --bg-secondary: #1C1C1E;
      --bg-tertiary:  #2C2C2E;
      --text-primary: #FFFFFF;
      --text-2:       rgba(255,255,255,0.60);
      --text-muted:   rgba(255,255,255,0.40);
      --text-faint:   rgba(255,255,255,0.25);
      --border:       rgba(255,255,255,0.10);
      --border-faint: rgba(255,255,255,0.05);
      --bar-fill:     #4A7FD4;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    /* iPhone 16: 393px logical width */
    max-width: 393px;
    margin: 0 auto;
    padding-bottom: 80px;
  }

  .nav {
    background: var(--bg-nav);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 14px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .nav-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .fy-pill {
    font-size: 13px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
    background: var(--bg-tertiary);
  }

  /* ── Strip shell ───────────────────────────────────────────────── */
  .strip {
    background: var(--bg-secondary);
    padding: 16px;
    border-bottom: 1px solid var(--border-faint);
  }

  /* Two-column: left=text, right=donut */
  .strip-body {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .strip-left { flex: 1; min-width: 0; }

  .plan-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 2px;
  }
  .plan-hero {
    font-size: 34px; font-weight: 700;
    letter-spacing: -1px; line-height: 1.05;
    margin-bottom: 12px;
  }

  /* Compact stat pair — label sits directly above value, no spread */
  .stat-row {
    display: flex;
    gap: 20px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1;
  }
  .stat-val {
    display: flex;
    align-items: baseline;
    gap: 3px;
  }
  .stat-amount {
    font-size: 26px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-amount.secondary {
    color: var(--text-2);
  }
  .stat-pct {
    font-size: 15px; font-weight: 400;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ── Stock rows ──────────────────────────────────────────────────── */
  .col-header {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1.2fr;
    padding: 10px 16px 6px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-faint);
  }
  .col-h {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .col-h.c { text-align: center; }
  .col-h.r { text-align: right; }
  .stock-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1.2fr;
    align-items: center;
    padding: 11px 16px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-faint);
  }
  .ticker { font-size: 17px; font-weight: 500; }
  .left-cell { text-align: center; }
  .left-amt { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .left-pct { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .inv-amt  { text-align: right; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-2); }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">Allocation</div>
  <div class="fy-pill">FY26</div>
</div>

<div class="strip">
  <div class="strip-body">
    <div class="strip-left">
      <p class="plan-label">Total Plan</p>
      <p class="plan-hero">₹35,00,000</p>
      <div class="stat-row">
        <div class="stat">
          <span class="stat-label">Left</span>
          <div class="stat-val">
            <span class="stat-amount">₹5.2L</span>
            <span class="stat-pct">62%</span>
          </div>
        </div>
        <div class="stat">
          <span class="stat-label">Invested</span>
          <div class="stat-val">
            <span class="stat-amount secondary">₹3.2L</span>
            <span class="stat-pct">38%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Donut: 38% invested. circumference of r=44 = 2π×44 ≈ 276.5; 38% ≈ 105.1 -->
    <svg width="108" height="108" viewBox="0 0 108 108" style="flex-shrink:0">
      <!-- track -->
      <circle cx="54" cy="54" r="44" fill="none"
        stroke="var(--border-faint)" stroke-width="11"/>
      <!-- fill -->
      <circle cx="54" cy="54" r="44" fill="none"
        stroke="var(--bar-fill)" stroke-width="11"
        stroke-dasharray="105.1 276.5"
        stroke-dashoffset="69.1"
        stroke-linecap="round"
        transform="rotate(-90 54 54)"/>
      <!-- center label -->
      <text x="54" y="50" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="18" font-weight="700"
        fill="var(--text-primary)">38%</text>
      <text x="54" y="66" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="10" font-weight="500" letter-spacing="0.04em"
        fill="var(--text-muted)">Invested</text>
    </svg>
  </div>
</div>

<div class="col-header">
  <span class="col-h">Stock</span>
  <span class="col-h c">Left</span>
  <span class="col-h r">Invested</span>
</div>
<div class="stock-row"><span class="ticker">RELIANCE</span><div class="left-cell"><div class="left-amt">₹54.6K</div><div class="left-pct">68%</div></div><div class="inv-amt">₹0</div></div>
<div class="stock-row"><span class="ticker">HDFCBANK</span><div class="left-cell"><div class="left-amt">₹42K</div><div class="left-pct">52%</div></div><div class="inv-amt">₹38K</div></div>
<div class="stock-row"><span class="ticker">INFY</span><div class="left-cell"><div class="left-amt">₹28K</div><div class="left-pct">35%</div></div><div class="inv-amt">₹52K</div></div>
<div class="stock-row"><span class="ticker">TITAN</span><div class="left-cell"><div class="left-amt">₹22K</div><div class="left-pct">27%</div></div><div class="inv-amt">₹58K</div></div>
<div class="stock-row"><span class="ticker">NESTLEIND</span><div class="left-cell"><div class="left-amt">₹18K</div><div class="left-pct">22%</div></div><div class="inv-amt">₹62K</div></div>

</body>
</html>
