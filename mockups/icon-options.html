<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary:   #F2F2F7;
    --bg-secondary: #FFFFFF;
    --text-primary: #000000;
    --text-muted:   rgba(0,0,0,0.40);
    --text-faint:   rgba(0,0,0,0.25);
    --border-faint: rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary:   #000000;
      --bg-secondary: #1C1C1E;
      --text-primary: #FFFFFF;
      --text-muted:   rgba(255,255,255,0.40);
      --text-faint:   rgba(255,255,255,0.25);
      --border-faint: rgba(255,255,255,0.05);
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    max-width: 430px;
    margin: 0 auto;
    padding: 32px 0 80px;
  }

  h2 {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 24px 20px 10px;
  }

  /* ── comparison grid ── */
  .compare {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    padding: 0 20px; gap: 12px;
  }
  .icon-card {
    background: var(--bg-secondary);
    border-radius: 16px;
    padding: 20px 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .icon-card svg { color: var(--text-primary); }
  .icon-card .lbl {
    font-size: 11px; font-weight: 500; color: var(--text-muted); text-align: center;
  }
  .icon-card .sublbl {
    font-size: 10px; color: var(--text-faint); text-align: center; margin-top: -6px;
  }

  /* ── simulated nav ── */
  .nav-wrap { padding: 24px 12px 0; }
  .nav-pill {
    background: var(--bg-secondary);
    border-radius: 28px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.13), 0 2px 6px rgba(0,0,0,0.07);
    display: flex; align-items: center; justify-content: space-around;
    padding: 10px 4px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 6px 14px; border-radius: 16px;
    color: var(--text-muted);
  }
  .tab.active { color: var(--text-primary); background: var(--bg-primary); }
  .tab span { font-size: 10px; font-weight: 500; }
  .tab.active span { font-weight: 600; }

  .divider { height: 1px; background: var(--border-faint); margin: 24px 20px 0; }
</style>
</head>
<body>

<div class="compare">

  <!-- Current: Allocation -->

      <rect x="17"   y="19.5" width="4"   height="3.5" rx="0.8"/>
    </svg>
    <span class="lbl">Bands</span>
    <span class="sublbl">bull + bars</span>
  </div>

  <!-- New: Transactions — ₹ with left/right arrows -->

    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Top row: arrow pointing left -->
      <line x1="20" y1="7" x2="5" y2="7"/>
      <polyline points="9,3 5,7 9,11"/>
      <!-- ₹ in center -->

            font-size="8" font-family="-apple-system,sans-serif"
            font-weight="700" stroke="none" fill="currentColor">₹</text>
      <!-- Bottom row: arrow pointing right -->
      <line x1="4" y1="18" x2="19" y2="18"/>
      <polyline points="15,14 19,18 15,22"/>
    </svg>
    <span class="lbl">Transactions</span>
    <span class="sublbl">₹ + arrows</span>
  </div>

</div>
