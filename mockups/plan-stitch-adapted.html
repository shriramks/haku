<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan — Stitch Layout · Haku language</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:           #F2F2F7;
    --card:         #FFFFFF;
    --text:         #000000;
    --text-2:       rgba(0,0,0,0.60);
    --muted:        rgba(0,0,0,0.40);
    --faint:        rgba(0,0,0,0.25);
    --border:       rgba(0,0,0,0.10);
    --border-faint: rgba(0,0,0,0.06);
    --bg-tert:      rgba(0,0,0,0.06);
    --accent:       #0A84FF;
    --positive:     #34C759;
    --nav-bg:       rgba(242,242,247,0.92);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:           #000000;
      --card:         #1C1C1E;
      --text:         #FFFFFF;
      --text-2:       rgba(255,255,255,0.60);
      --muted:        rgba(255,255,255,0.40);
      --faint:        rgba(255,255,255,0.25);
      --border:       rgba(255,255,255,0.10);
      --border-faint: rgba(255,255,255,0.05);
      --bg-tert:      rgba(255,255,255,0.06);
    }
    header { background: rgba(0,0,0,0.90) !important; }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 430px; margin: 0 auto;
    padding-bottom: 108px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(242,242,247,0.90);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-faint);
    padding: 16px 16px 12px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.3px; }
  .fy-pill {
    display: flex; align-items: center; gap: 4px;
    background: var(--card); border-radius: 10px;
    padding: 6px 10px; font-size: 14px; font-weight: 500;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card); display: flex; align-items: center; justify-content: center;
  }
  .muted-icon { width: 18px; height: 18px; color: var(--muted); }

  /* ── Budget section ── */
  /* Budget rows: the Stitch design surfaces these as prominent label→value rows */
  .budget-section {
    margin-top: 20px;
    background: var(--card);
    border-top: 1px solid var(--border-faint);
    border-bottom: 1px solid var(--border-faint);
  }
  .budget-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; min-height: 48px;
  }
  .budget-row + .budget-row { border-top: 1px solid var(--border-faint); }
  .budget-lbl { font-size: 17px; }
  .budget-val { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .edit-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--bg-tert); margin-left: 10px; flex-shrink: 0;
  }

  /* ── Section header ── */
  .section-hdr {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--faint);
    padding: 20px 16px 8px;
  }

  /* ── Allocation bar + summary (existing Plan style) ── */
  .alloc-bar-wrap {
    padding: 0 16px 12px;
  }
  .alloc-bar-track {
    height: 6px; border-radius: 99px; background: var(--border); overflow: hidden;
  }
  .alloc-bar-fill {
    height: 100%; border-radius: 99px;
    background: var(--positive);
  }
  .alloc-bar-meta {
    display: flex; justify-content: space-between;
    margin-top: 6px; font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .alloc-bar-meta .ok { color: var(--positive); }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 8px 16px 10px;
    border-bottom: 1px solid var(--border-faint);
  }
  .tool-btn {
    font-size: 15px; padding: 8px 14px; border-radius: 12px;
    color: var(--text-2); background: var(--bg-tert);
  }
  .tool-btn-accent {
    font-size: 15px; font-weight: 500; padding: 8px 14px; border-radius: 12px;
    color: var(--accent); background: rgba(10,132,255,0.10);
  }

  /* ── Stock rows ── */
  /* Stitch shows full dollar amount prominently (13px, not 11px footnote) */
  .stock-row {
    display: flex; align-items: center;
    padding: 14px 16px; min-height: 52px;
  }
  .stock-info { flex: 1; min-width: 0; }
  .stock-sym { font-size: 17px; font-weight: 600; }
  .stock-cat { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .stock-right { text-align: right; margin-right: 8px; }
  .stock-pct { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Promoted from 11px footnote → 13px subheadline so full amount is legible */
  .stock-amt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .chev { width: 14px; height: 14px; color: var(--faint); flex-shrink: 0; }
  .row-div { height: 1px; background: var(--border-faint); margin: 0 16px; }

  /* ── Nav ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 28px;
    background: var(--bg);
    max-width: 430px; margin: 0 auto;
  }
  .nav-pill {
    display: flex; align-items: center; justify-content: space-around; flex: 1;
    background: var(--card); border-radius: 28px; padding: 8px 4px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.13), 0 2px 6px rgba(0,0,0,0.07);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 16px; color: var(--muted); }
  .tab.active { color: var(--text); background: var(--bg); }
  .tab span { font-size: 10px; font-weight: 500; }
  .tab.active span { font-weight: 600; }
  .plus-btn {
    width: 54px; height: 54px; border-radius: 24px;
    background: var(--card); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px rgba(0,0,0,0.13), 0 2px 6px rgba(0,0,0,0.07);
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>Plan</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="fy-pill">

        </svg>
      </div>
      <div class="icon-btn">
        <svg class="muted-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
    </div>
  </div>
</header>

<!-- Budget rows — Stitch surfaces these prominently as label → value pairs -->
<div class="budget-section">
  <div class="budget-row">
    <span class="budget-lbl">Total Budget</span>
    <div style="display:flex;align-items:center">
      <span class="budget-val">₹33,40,000</span>

        <svg style="width:14px;height:14px;color:var(--muted)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 13l6.5-6.5a2 2 0 112.828 2.828L11.828 15.828a4 4 0 01-1.897 1.06l-2.796.699.699-2.796A4 4 0 019 13z"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="budget-row">
    <span class="budget-lbl">Deploy Capital</span>
    <span class="budget-val">₹2,30,000</span>
  </div>
</div>

<!-- Stocks section -->
<div class="section-hdr">Stocks</div>

<!-- Allocation bar (existing Plan style — kept as-is) -->
<div class="alloc-bar-wrap">
  <div class="alloc-bar-track">
    <div class="alloc-bar-fill" style="width:95%"></div>
  </div>
  <div class="alloc-bar-meta">
    <span>5 stocks</span>
    <span class="ok">95% allocated · 5% free</span>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <button class="tool-btn">Export</button>
  <button class="tool-btn">Clear All</button>
  <button class="tool-btn-accent">+ Add Stock</button>
</div>

<!-- Stock rows — sorted by % desc, full INR amount at subheadline (13px) -->
<div>

    </svg>
  </div>

  <div class="stock-row">
    <div class="stock-info">
      <div class="stock-sym">ITC</div>

      <div class="stock-pct">17.0%</div>

    <svg class="chev" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
    </svg>
  </div>
  <div class="row-div"></div>

  <div class="stock-row">
    <div class="stock-info">
      <div class="stock-sym">CAMS</div>
      <div class="stock-cat">Cap-light</div>
    </div>
    <div class="stock-right">
      <div class="stock-pct">16.4%</div>

    </div>
    <svg class="chev" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
    </svg>
  </div>
  <div class="row-div"></div>

  <div class="stock-row">
    <div class="stock-info">
      <div class="stock-sym">NH</div>

    </svg>
  </div>
  <div class="row-div"></div>

  <div class="stock-row">
    <div class="stock-info">
      <div class="stock-sym">IEX</div>

    </div>
    <div class="stock-right">

</div>

</body>
</html>
